<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Portafolio Ferias</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111;--mut:#6b7280;--line:#d9dce1;--acc:#0b6bcb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{background:#111;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header .row{display:flex;gap:8px;align-items:center}
header h1{font-size:17px;margin:0;flex:1}
header .ib{background:#2a2a2a;color:#fff;border:0;border-radius:8px;width:42px;height:42px;font-size:20px}
.fer{margin-top:8px}
.fer input{width:100%;border:0;border-radius:8px;padding:10px;font-size:16px;background:#2a2a2a;color:#fff}
.fer input::placeholder{color:#9ca3af}
.tabs{display:flex;background:#111;position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px;border:0;background:#111;color:#9ca3af;border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:#fff;border-color:var(--acc)}
.tools{display:flex;gap:6px;padding:10px 12px 0}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;background:#fff;min-width:0}
.tools input{flex:1}
.tools select{flex:1}
#count{padding:6px 14px;color:var(--mut);font-size:13px}
#list,#bandeja{padding:0 12px 100px;display:grid;gap:10px}
.item{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer}
.thumb{width:76px;height:76px;border-radius:8px;background:#e5e7eb center/cover no-repeat;flex:none;display:grid;place-items:center;color:#9ca3af;font-size:28px}
.item .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:12px;background:#eef2f7;border-radius:99px;padding:2px 8px}
.tag.ok{background:#dcfce7;color:var(--ok)}
.tag.warn{background:#fef3c7;color:var(--warn)}
.star{color:#d97706;letter-spacing:1px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(rgba(243,244,246,0),#f3f4f6 35%)}
#bottom button{flex:1;padding:15px 8px;border:0;border-radius:12px;font-weight:700;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#bQuick{background:#111;color:#fff}
#bNew{background:var(--acc);color:#fff}
.cap{background:var(--card);border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cap .top{display:flex;gap:10px}
.cap img{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none}
.cap textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;min-height:96px;resize:vertical}
.cap .meta{font-size:12px;color:var(--mut);margin:6px 0}
.cap .btns{margin-top:4px}
/* form */
#formView{padding-bottom:90px}
.bar{position:sticky;top:0;z-index:10;background:#111;color:#fff;display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.bar b{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{background:#2a2a2a;color:#fff;border:0;border-radius:8px;padding:10px 12px}
#saved{font-size:12px;color:#86efac}
section.sec{background:var(--card);margin:10px 12px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
section.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:16px;color:var(--ink);background:#fff;font-family:inherit}
label.f textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.g2 .full{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.chip input{display:none}
.chip span{display:inline-block;border:1.5px solid var(--line);border-radius:99px;padding:10px 14px;background:#fff}
.chip input:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.chip input:checked+span::before{content:"✓ "}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ph1{position:relative;width:88px;height:88px;border-radius:8px;background:#e5e7eb center/cover}
.ph1 button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff}
.ph1 em{position:absolute;left:0;right:0;bottom:0;background:rgba(21,128,61,.88);color:#fff;font-size:11px;text-align:center;font-style:normal;border-radius:0 0 8px 8px}
.hint{color:var(--mut);font-size:13px}
.btns{display:flex;gap:8px}
.btn{flex:1;border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:12px 8px;font-weight:600}
.btn.pri{background:var(--acc);color:#fff}
.btn.dark{background:#111;border-color:#111;color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.stars{margin-bottom:6px}
.stars button{background:none;border:0;font-size:32px;color:#d1d5db;padding:0 4px}
.stars button.on{color:#d97706}
details.reg{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fafafa}
details.reg>summary{display:flex;gap:10px;align-items:center;padding:8px;cursor:pointer;list-style:none}
details.reg>summary::-webkit-details-marker{display:none}
.rth{width:52px;height:52px;border-radius:8px;background:#e5e7eb center/cover;flex:none;display:grid;place-items:center;color:#9ca3af}
.rt{flex:1;min-width:0}
.rt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--warn)}
.rt small.ok{color:var(--ok)}
.rbody{padding:0 10px 10px}
details.mas{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
details.mas>summary{cursor:pointer;color:var(--acc);font-weight:600;padding:6px 0}
details.masp>summary{cursor:pointer;font-weight:600;color:var(--acc)}
.rfoot{display:flex;gap:8px;align-items:center;margin-top:6px}
.rfoot .x{border:0;background:#fee2e2;color:var(--bad);border-radius:8px;padding:10px 12px}
#menu{position:fixed;right:10px;top:56px;z-index:30;background:#fff;color:#111;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:250px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 16px;border-bottom:1px solid #eee}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90%}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.mbox h3{margin:0 0 8px}
.mbox img.pv{width:100%;max-height:38vh;object-fit:contain;border-radius:8px;background:#eee;margin-bottom:8px}
/* impresión */
#print{display:none}
.ficha{font-family:Arial,sans-serif;color:#000}
.ficha .fh{display:flex;gap:14px;margin-bottom:10px}
.ficha .fbox{width:62mm;height:48mm;border:1px solid #444;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ficha .fbox img{max-width:100%;max-height:100%}
.ficha .ff{flex:1;font-size:11pt}
.ficha .ff div{border-bottom:1px solid #666;margin-bottom:3px;padding-bottom:1px;display:flex;gap:6px}
.ficha .ff span{color:#333;white-space:nowrap}
.ficha .ff i{font-style:normal;font-weight:bold}
.ficha .ff .chk{border:0;margin-top:8px;gap:18px}
.ficha .fm{font-size:9pt;text-align:right;width:36mm;color:#333}
.ficha table{width:100%;border-collapse:collapse;font-size:10pt}
.ficha th,.ficha td{border:1px solid #888;padding:3px 5px;vertical-align:top}
.ficha th{font-weight:normal;text-align:center}
.ficha td{height:8.2mm}
.ficha .obs{border:1px solid #888;margin-top:8px;padding:4px 6px;min-height:22mm;font-size:10pt}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body>*:not(#print){display:none!important}
 #print{display:block}
 body{background:#fff}
 .ficha{page-break-after:always}
 .ficha:last-child{page-break-after:auto}
}
</style>
</head>

<!-- LISTA -->
<div id="listView">
 <header>
  <div class="row"><h1>📒 Portafolio Ferias</h1><button class="ib" id="btnMenu" aria-label="Menú">⋮</button></div>

 <div class="bar">

   <h2>Foto del stand / tarjeta</h2>

    <button class="btn pri" data-act="cam">📷 Tomar foto</button>

    <label class="chip"><input type="radio" name="rubro" data-k="rubro" value="alfombra"><span>Alfombras</span></label>

<script>
'use strict';
const STATES=['Nuevo','Por contactar','Cotizando','Muestra solicitada','Negociando','Descartado'];
const INCO=['','EXW','FOB','CIF','CFR','DDP'];
const MON=['USD','CNY','EUR','CLP'];
/* Campos de "más detalles" según rubro. Para agregar/quitar campos edita solo esta tabla. */
const LBL={material:'Material / composición',nudos:'Nudos / densidad',textura:'Textura / pelo',hilos:'Hilos / gramaje',colores:'Colores',medidas:'Medidas',esp:'Otras especificaciones'};
const FIELDS={
  alfombra:['material','nudos','textura','colores','medidas','esp'],
  textil:['material','hilos','colores','medidas','esp'],
  otro:['material','colores','medidas','esp']
};
const RUBRO={alfombra:'Alfombras',textil:'Textil hogar',otro:'Otro'};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fmtFecha=iso=>{if(!iso)return '';const p=iso.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:iso};
const fmtTs=ts=>{const d=new Date(ts);return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
const newReg=()=>({id:uid(),nombre:'',nota:'',precio:'',fotos:[],muestras:[],d:{},listo:false});
const newRec=()=>({id:uid(),feria:ls('feria'),fecha:hoy(),proveedor:'',pais:'',rubro:ls('rubro')||'alfombra',puerto:'',plazo:'',produccion:'',catalogo:false,muestra:false,enviara:false,contacto:'',cargo:'',email:'',tel:'',wechat:'',web:'',stand:'',incoterm:'',moneda:'USD',moq:'',interes:0,estado:'Nuevo',obs:'',fotos:[],regs:[],mod:Date.now()});
const regVacio=r=>!(r.nombre||r.nota||r.precio||r.fotos.length||r.muestras.length||Object.values(r.d).some(Boolean));
const isEmpty=p=>!(p.proveedor||p.pais||p.contacto||p.obs||p.fotos.length||p.regs.length);

/* Normaliza registros viejos (v1: productos[] -> regs[]) */
function normalize(p){
  p.fotos=p.fotos||[];p.rubro=p.rubro||'otro';p.estado=p.estado||'Nuevo';p.interes=p.interes||0;
  if(!p.regs){
    p.regs=(p.productos||[]).filter(x=>x.desc||x.precio||x.medidas||x.comp||x.esp||x.foto).map(x=>({id:uid(),nombre:x.desc||'',nota:'',precio:x.precio||'',fotos:x.foto?[x.foto]:[],muestras:[],d:{medidas:x.medidas||'',material:x.comp||'',esp:x.esp||''},listo:true}));
  }
  delete p.productos;
  p.regs.forEach(r=>{r.fotos=r.fotos||[];r.muestras=r.muestras||[];r.d=r.d||{};if(!r.id)r.id=uid()});
  return p;
}

/* ---------- IndexedDB ---------- */
let db,items=[],caps=[],cur=null,saveT=null,tab='p';
const OPEN=new Set();
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('feria_prov',1);r.onupgradeneeded=()=>r.result.createObjectStore('prov',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const st=m=>db.transaction('prov',m).objectStore('prov');
const dbAll=()=>new Promise((res,rej)=>{const q=st('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=o=>new Promise((res,rej)=>{const q=st('readwrite').put(o);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const dbDel=id=>new Promise((res,rej)=>{const q=st('readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
function showModal(h){$('#mbox').innerHTML=h;$('#modal').hidden=false}
function hideModal(){$('#modal').hidden=true;$('#mbox').innerHTML=''}

/* ---------- Fotos ---------- */
function compress(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('No se pudo leer la imagen'))};
    img.src=u;
  });
}
/* Abre la cámara (o selector) y entrega la imagen comprimida. Debe llamarse dentro de un toque del usuario. */
function pickPhoto(cb,opts){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';
  if(!(opts&&opts.gallery))inp.setAttribute('capture','environment');
  inp.onchange=async()=>{
    const f=inp.files[0];inp.remove();if(!f)return;

    (p.regs.length?p.regs:[null]).forEach(r=>rows.push(r?[...base,r.nombre,r.precio,...KEYS.map(k=>r.d[k]||''),r.nota,yn(r.listo),r.fotos.length+r.muestras.length]:[...base,'','',...KEYS.map(()=>''),'','',p.fotos.length]));

}

/* ZIP sin compresión (las fotos ya son JPEG) */
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function dataToU8(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0,cds=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nm);cds+=46+nm.length;off+=30+nm.length+sz;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}
function exportZIP(){
  const files=[],used=new Set();
  const san=s=>String(s||'').replace(/[\\/:*?"<>|\r\n]+/g,'-').trim().slice(0,40);
  const add=(path,img)=>{let n=path,i=2;while(used.has(n)){n=path.replace(/\.jpg$/,' ('+i+').jpg');i++}used.add(n);files.push({name:n,data:dataToU8(img)})};
  visible().forEach((p,pi)=>{
    const dir=p2(pi+1)+' '+(san(p.proveedor)||'Sin nombre')+'/';
    p.fotos.forEach((f,k)=>add(dir+'00 stand-tarjeta '+(k+1)+'.jpg',f));
    p.regs.forEach((r,ri)=>{
      const base=dir+p2(ri+1)+' '+(san(r.nombre||r.nota)||'registro');
      r.fotos.forEach((f,k)=>add(base+' - coleccion '+(k+1)+'.jpg',f));
      r.muestras.forEach((f,k)=>add(base+' - muestra '+(k+1)+'.jpg',f));
    });
  });
  caps.slice().sort((a,b)=>a.ts-b.ts).forEach(c=>{const d=new Date(c.ts);add('_Bandeja/'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+' '+san(c.nota)+'.jpg',c.fotos[0])});
  if(!files.length){toast('No hay fotos para exportar');return}
  saveFile('fotos-ferias '+stamp()+'.zip',makeZip(files),'application/zip');
}

/* ---------- Impresión: mismo formato de la hoja física ---------- */
function ficha(p){
  const rows=p.regs.filter(r=>!regVacio(r)).map(r=>{
    const lab=k=>r.d[k]?LBL[k]+': '+r.d[k]:'';
    return {desc:r.nombre||r.nota,precio:r.precio,medidas:r.d.medidas,comp:r.d.material,esp:['nudos','textura','hilos','colores','esp'].map(lab).filter(Boolean).concat(r.nombre&&r.nota?[r.nota]:[]).join(' · ')};
  });
  while(rows.length<12)rows.push({});
  const box=v=>v?'☒':'☐';
  const contacto=[p.contacto,p.cargo,p.email,p.tel,p.wechat,p.web].filter(Boolean).join(' · ');
  return `<section class="ficha"><div class="fh">
   <div class="fbox">${p.fotos[0]?`<img src="${p.fotos[0]}">`:''}</div>
   <div class="ff">
    <div><span>PROVEEDOR</span><i>${esc(p.proveedor)}</i></div>
    <div><span>PAÍS</span><i>${esc(p.pais)}</i></div>
    <div><span>PUERTO</span><i>${esc(p.puerto)}</i></div>
    <div><span>PLAZO DE PAGO</span><i>${esc(p.plazo)}</i></div>
    <div><span>TIEMPO DE PRODUCCIÓN</span><i>${esc(p.produccion)}</i></div>
    <div class="chk"><span>CATÁLOGO ${box(p.catalogo)}</span><span>MUESTRA ${box(p.muestra)}</span><span>ENVIARÁ MUESTRA ${box(p.enviara)}</span></div>
    ${contacto?`<div style="border:0;font-size:9pt"><span>Contacto:</span>${esc(contacto)}</div>`:''}
   </div>
   <div class="fm">${esc(p.feria)}<br>${fmtFecha(p.fecha)}<br>${'★'.repeat(p.interes)}<br>${esc([p.incoterm,p.moneda,p.moq&&('MOQ '+p.moq)].filter(Boolean).join(' · '))}</div>
  </div>
  <table><thead><tr><th style="width:27%">PRODUCTO / DESCRIPCIÓN</th><th style="width:9%">PRECIO</th><th style="width:11%">MEDIDAS</th><th style="width:17%">COMPOSICIÓN</th><th>ESPECIFICACIONES</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${esc(x.desc)}</td><td>${esc(x.precio)}</td><td>${esc(x.medidas)}</td><td>${esc(x.comp)}</td><td>${esc(x.esp)}</td></tr>`).join('')}
  </tbody></table>
  <div class="obs">Obs ${esc(p.obs)}</div></section>`;
}
function imprimir(list){
  if(!list.length){toast('No hay fichas para imprimir');return}
  $('#print').innerHTML=list.map(ficha).join('');
  setTimeout(()=>window.print(),150);
}
